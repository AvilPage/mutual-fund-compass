name: Update data

on:
  schedule:
    - cron: '30 2 * * 1'  # Mondays 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run index.py --no-open
      - name: Sanity check
        run: test "$(wc -l < index.csv)" -gt 1500
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.csv index.html isin
          git diff --cached --quiet || (git commit -m "Update data" && git push)
